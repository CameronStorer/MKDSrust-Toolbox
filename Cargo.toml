[workspace]
members = ["crates/nitro-formats", "crates/mkds-data", "crates/toolbox-core", "crates/toolbox-cli", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
nitro-formats = { path = "crates/nitro-formats" }
mkds-data = { path = "crates/mkds-data" }
toolbox-core = { path = "crates/toolbox-core" }

[profile.dev]
debug = 0

[profile.test]
debug = 0
